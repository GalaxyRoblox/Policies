[project]
site_name = "Galaxy Policies"
site_url = "https://policy.galaxy.casa" # TODO: This will be loaded from the environment once Zensical supports doing so
repo_url = "https://github.com/GalaxyRoblox/Policies"
repo_name = "GalaxyRoblox/Policies"
edit_uri = "edit/main/docs/" # TODO: This will be loaded from the environment once Zensical supports doing so
docs_dir = "docs"
copyright = "Copyright &copy; 2025, GalaxyRoblox"

site_author = "GalaxyRoblox"
site_description = "This website contains some of the policies used by the Galaxy staff team."

[project.theme]
features = [
  "announce.dismiss",
  "content.action.view",
  # "header.autohide",  # TODO: Enable this again whenever the ToC properly scales with the header hiding animation
  "navigation.footer",
  # TODO: Enable these once Zensical supports reading configuration from the environment
  # "navigation.instant",
  # "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.tracking",
  "navigation.top",
  "navigation.sections",
  "navigation.path",
  "search.highlight",
  "toc.follow",
  "toc.integrate",
]
font.text = "Comfortaa"
font.code = "Roboto Code"
logo = "img/galaxy.png"
favicon = "img/galaxy.png"

[project.theme.icon]
annotation = "material/chevron-right-circle-outline"
repo = "fontawesome/brands/github"
view = "material/eye"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "simple/roblox"
link = "https://www.roblox.com/games/12426862174"
name = "Play Galaxy on Roblox!"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.com/invite/robloxgalaxy"
name = "Join the official Galaxy Discord server!"

[[project.extra.social]]
icon = "simple/miraheze"
link = "https://wiki.galaxy.casa"
name = "Galaxypedia - The official Galaxy wiki!"

[project.markdown_extensions.abbr]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"
[project.markdown_extensions.pymdownx.blocks]
[project.markdown_extensions.pymdownx.blocks.admonition]
[project.markdown_extensions.pymdownx.blocks.caption]
[project.markdown_extensions.pymdownx.blocks.definition]
[project.markdown_extensions.pymdownx.blocks.details]
[project.markdown_extensions.pymdownx.blocks.tab]
alternate_style = true
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
auto_append = ["includes/abbreviations.md"]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
